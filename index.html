<!-- Sekcja Zarządzania Rolami (Widoczna tylko dla Właściciela) -->
<div id="roles-manager-section" style="display: none; margin-top: 20px; background: #1e293b; padding: 20px; border-radius: 12px;">
    <h2>👑 Zarządzanie Permisjami Ról</h2>
    <p style="color: #94a3b8; font-size: 14px; margin-bottom: 15px;">Wybierz rolę z serwera i nadaj jej konkretne uprawnienia do panelu:</p>
    
    <select id="role-select" onchange="loadRolePermissions()" style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; margin-bottom: 15px;"></select>

    <div id="permissions-checkboxes">
        <label style="display: block; margin: 8px 0;"><input type="checkbox" id="perm-automod"> Zarządzanie AutoModem</label>
        <label style="display: block; margin: 8px 0;"><input type="checkbox" id="perm-announcements"> Wysyłanie Ogłoszeń</label>
        <label style="display: block; margin: 8px 0;"><input type="checkbox" id="perm-logs"> Podgląd Logów i Dziennika Kar</label>
    </div>

    <button onclick="saveRolePermissions()" style="margin-top: 15px; padding: 10px 20px; background: #38bdf8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Zapisz Permisje Roli</button>
</div>

<script>
    const API_BASE = 'http://de1.bot-hosting.cloud:25826/api';
    const GUILD_ID = 'TWOJE_ID_SERWERA';
    let currentUserId = 'ID_ZALOGOWANEGO_UZYTKOWNIKA'; // Ustawiane po zalogowaniu
    let cachedRolePerms = {};

    // 1. Inicjalizacja Praw i Statystyk
    async function initDashboard() {
        await checkUserPermissions();
        startLiveStats();
    }

    // 2. Weryfikacja Permisji Użytkownika
    async function checkUserPermissions() {
        try {
            const res = await fetch(`${API_BASE}/user-access/${GUILD_ID}/${currentUserId}`);
            const data = await res.json();

            // Ustawienie profilu
            document.querySelector('.user-profile span').innerText = `${data.user.tag}`;
            if (data.user.avatar) document.querySelector('.avatar').src = data.user.avatar;

            // Kontrola widoczności elementów panelu
            if (data.permissions.isOwner) {
                document.getElementById('roles-manager-section').style.display = 'block';
                loadGuildRoles();
            }

            // Ograniczenia dostępności przycisków na podstawie permisji
            if (!data.permissions.canManageAutoMod) {
                document.getElementById('toggle-antilink').disabled = true;
                document.getElementById('toggle-anticaps').disabled = true;
            }
        } catch (e) {
            console.error('Błąd podczas pobierania permisji:', e);
        }
    }

    // 3. Pobieranie Ról Serwera
    async function loadGuildRoles() {
        const res = await fetch(`${API_BASE}/roles/${GUILD_ID}`);
        const data = await res.json();
        cachedRolePerms = data.permissions;

        const select = document.getElementById('role-select');
        select.innerHTML = '';
        data.roles.forEach(role => {
            const opt = document.createElement('option');
            opt.value = role.id;
            opt.innerText = role.name;
            select.appendChild(opt);
        });

        loadRolePermissions();
    }

    function loadRolePermissions() {
        const roleId = document.getElementById('role-select').value;
        const perms = cachedRolePerms[roleId] || {};

        document.getElementById('perm-automod').checked = !!perms.canManageAutoMod;
        document.getElementById('perm-announcements').checked = !!perms.canSendAnnouncements;
        document.getElementById('perm-logs').checked = !!perms.canViewLogs;
    }

    async function saveRolePermissions() {
        const roleId = document.getElementById('role-select').value;
        const permissions = {
            canManageAutoMod: document.getElementById('perm-automod').checked,
            canSendAnnouncements: document.getElementById('perm-announcements').checked,
            canViewLogs: document.getElementById('perm-logs').checked
        };

        const res = await fetch(`${API_BASE}/roles/permissions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ guildId: GUILD_ID, roleId, permissions })
        });

        const data = await res.json();
        alert(data.message);
    }

    // 4. Odświeżanie Statystyk na Żywo (Co 3 sekundy)
    function startLiveStats() {
        async function update() {
            try {
                const res = await fetch(`${API_BASE}/stats/live/${GUILD_ID}`);
                const data = await res.json();

                document.getElementById('user-count').innerText = `${data.members.total} (${data.members.online} online)`;
                document.getElementById('warn-count').innerText = data.warns;
                document.getElementById('ping-val').innerText = `${data.ping} ms`;
            } catch (e) {
                document.getElementById('ping-val').innerText = 'OFFLINE';
            }
        }

        update();
        setInterval(update, 3000); // Pobieranie danych co 3 sekundy
    }

    window.onload = initDashboard;
</script>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Zarządzania Bota</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --sidebar-bg: #1e293b;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --border-color: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-primary); overflow-x: hidden; }
        .dashboard-container { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .sidebar-header { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .logo-icon { font-size: 28px; color: var(--accent-blue); }
        .sidebar-menu { display: flex; flex-direction: column; gap: 10px; }
        .sidebar-menu a { color: var(--text-secondary); text-decoration: none; padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 12px; transition: 0.3s; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: var(--accent-blue); color: #fff; }
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-secondary); }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.online { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .user-profile { display: flex; align-items: center; gap: 10px; background: var(--card-bg); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border-color); }
        .avatar { width: 35px; height: 35px; border-radius: 50%; }

        /* Cards Grid */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; }
        .card-icon { width: 50px; height: 50px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 22px; }
        .card-icon.blue { background-color: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
        .card-icon.red { background-color: rgba(248, 113, 113, 0.2); color: var(--accent-red); }
        .card-icon.yellow { background-color: rgba(251, 191, 36, 0.2); color: var(--accent-yellow); }
        .card-info h3 { font-size: 14px; color: var(--text-secondary); }
        .card-info p { font-size: 20px; font-weight: bold; }

        /* Form Control Box */
        .panel-box { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 25px; }
        .panel-box h2 { font-size: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        input[type="text"], textarea, select { width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; border-radius: 6px; margin: 6px 0 15px 0; outline: none; }
        button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-blue { background: var(--accent-blue); color: #000; }
        .btn-green { background: var(--accent-green); color: #000; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-robot logo-icon"></i>
                <h2>BotAdmin</h2>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="active"><i class="fa-solid fa-chart-line"></i> Statystyki Live</a>
                <a href="#automod-section"><i class="fa-solid fa-shield-halved"></i> AutoMod</a>
                <a href="#announcement-section"><i class="fa-solid fa-bullhorn"></i> Ogłoszenie</a>
                <a href="#roles-section"><i class="fa-solid fa-user-shield"></i> Uprawnienia Ról</a>
            </nav>
            <div class="sidebar-footer">
                <div class="status-indicator">
                    <span class="dot online" id="status-dot"></span>
                    <span id="bot-status-text">Łączenie z botem...</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h1>Przegląd Serwera</h1>
                
                <!-- Logowanie/Identyfikacja po Discord ID -->
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="user-id-input" placeholder="Wpisz swoje ID Discord..." style="margin: 0; width: 220px;">
                    <button onclick="loginUser()" class="btn-blue">Zaloguj / Sprawdź</button>
                    <div class="user-profile">
                        <img src="https://cdn.discordapp.com/embed/avatars/0.png" id="user-avatar" class="avatar">
                        <span id="user-tag-text">Niezalogowany</span>
                    </div>
                </div>
            </header>

            <!-- Statystyki na żywo -->
            <div class="cards-grid">
                <div class="card">
                    <div class="card-icon blue"><i class="fa-solid fa-users"></i></div>
                    <div class="card-info">
                        <h3>Użytkownicy (Online)</h3>
                        <p id="user-count">--</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon red"><div class="card-icon red"><i class="fa-solid fa-triangle-exclamation"></i></div></div>
                    <div class="card-info">
                        <h3>Suma Aktywnych Warnów</h3>
                        <p id="warn-count">--</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon yellow"><i class="fa-solid fa-bolt"></i></div>
                    <div class="card-info">
                        <h3>Ping Bota</h3>
                        <p id="ping-val">-- ms</p>
                    </div>
                </div>
            </div>

            <!-- MODUŁ 1: Konfiguracja AutoModa -->
            <div class="panel-box" id="automod-section">
                <h2><i class="fa-solid fa-shield-halved" style="color: var(--accent-blue);"></i> Konfiguracja AutoModa</h2>
                <label style="display: block; margin: 10px 0; cursor: pointer;">
                    <input type="checkbox" id="toggle-antilink"> Blokada wysyłania linków (Anti-Link)
                </label>
                <label style="display: block; margin: 10px 0; cursor: pointer;">
                    <input type="checkbox" id="toggle-anticaps"> Blokada CAPS LOCKA (Anti-Caps)
                </label>
                <button onclick="saveAutoMod()" id="btn-save-automod" class="btn-blue" disabled>Zapisz Ustawienia AutoModa</button>
            </div>

            <!-- MODUŁ 2: Wysyłanie Ogłoszeń z Panelu -->
            <div class="panel-box" id="announcement-section">
                <h2><i class="fa-solid fa-bullhorn" style="color: var(--accent-green);"></i> Wyślij Ogłoszenie na Kanał</h2>
                <label>ID Kanału Discord:</label>
                <input type="text" id="channel-id-input" placeholder="np. 123456789012345678">
                <label>Tytuł Ogłoszenia:</label>
                <input type="text" id="msg-title-input" placeholder="np. Ważny Komunikat">
                <label>Treść Wiadomości:</label>
                <textarea id="msg-content-input" placeholder="Wpisz treść ogłoszenia..."></textarea>
                <button onclick="sendAnnouncement()" id="btn-send-msg" class="btn-green" disabled>Wyślij na Discorda</button>
            </div>

            <!-- MODUŁ 3: Uprawnienia Ról (Widoczny dla Właściciela) -->
            <div class="panel-box" id="roles-section" style="display: none;">
                <h2><i class="fa-solid fa-user-shield" style="color: var(--accent-yellow);"></i> Permisje Ról (Dla Właściciela)</h2>
                <label>Wybierz rolę z serwera:</label>
                <select id="role-select" onchange="loadRolePermissions()"></select>

                <div style="margin: 15px 0;">
                    <label style="display: block; margin: 8px 0;"><input type="checkbox" id="perm-automod"> Dostęp do edycji AutoModa</label>
                    <label style="display: block; margin: 8px 0;"><input type="checkbox" id="perm-announcements"> Dostęp do wysyłania ogłoszeń</label>
                </div>
                <button onclick="saveRolePermissions()" class="btn-blue">Zapisz Permisje Roli</button>
            </div>
        </main>
    </div>

    <script>
        // PODMIENIĆ NA ID TWOJEGO SERWERA DISCORD:
        const GUILD_ID = 'WPISZ_TUTAJ_ID_SWOJEGO_SERWERA';
        const API_BASE = 'http://de1.bot-hosting.cloud:25826/api';

        let currentUserPermissions = {};
        let cachedRolePerms = {};

        // 1. Aktualizacja Statystyk na żywo
        async function fetchLiveStats() {
            try {
                const response = await fetch(`${API_BASE}/stats/live/${GUILD_ID}`);
                if (!response.ok) throw new Error('Serwer niedostępny');
                
                const data = await response.json();

                document.getElementById('user-count').innerText = `${data.members.total} (${data.members.online} online)`;
                document.getElementById('warn-count').innerText = data.warns;
                document.getElementById('ping-val').innerText = `${data.ping} ms`;

                document.getElementById('bot-status-text').innerText = 'Bot Status: ONLINE';
                document.getElementById('status-dot').className = 'dot online';
            } catch (error) {
                document.getElementById('ping-val').innerText = 'OFFLINE';
                document.getElementById('bot-status-text').innerText = 'Bot Status: OFFLINE';
                document.getElementById('status-dot').className = 'dot';
            }
        }

        // 2. Logowanie i weryfikacja uprawnień użytkownika po ID
        async function loginUser() {
            const userId = document.getElementById('user-id-input').value.trim();
            if (!userId) return alert('Wpisz prawidłowe ID użytkownika!');

            try {
                const res = await fetch(`${API_BASE}/user-access/${GUILD_ID}/${userId}`);
                const data = await res.json();

                if (data.error) return alert('Błąd: ' + data.error);

                document.getElementById('user-tag-text').innerText = data.user.tag;
                if (data.user.avatar) document.getElementById('user-avatar').src = data.user.avatar;

                currentUserPermissions = data.permissions;

                // Włączanie / wyłączanie przycisków w zależności od uprawnień
                document.getElementById('btn-save-automod').disabled = !currentUserPermissions.canManageAutoMod;
                document.getElementById('btn-send-msg').disabled = !currentUserPermissions.canSendAnnouncements;

                // Pokazywanie panelu ról tylko dla właściciela
                if (currentUserPermissions.isOwner) {
                    document.getElementById('roles-section').style.display = 'block';
                    loadGuildRoles();
                } else {
                    document.getElementById('roles-section').style.display = 'none';
                }

                alert(`Zalogowano jako ${data.user.tag}! Sprawdzono Twoje uprawnienia.`);
            } catch (e) {
                alert('Błąd podczas weryfikacji użytkownika w botcie.');
            }
        }

        // 3. Pobieranie ról serwera dla Właściciela
        async function loadGuildRoles() {
            try {
                const res = await fetch(`${API_BASE}/roles/${GUILD_ID}`);
                const data = await res.json();
                cachedRolePerms = data.permissions || {};

                const select = document.getElementById('role-select');
                select.innerHTML = '';
                data.roles.forEach(role => {
                    const opt = document.createElement('option');
                    opt.value = role.id;
                    opt.innerText = role.name;
                    select.appendChild(opt);
                });

                loadRolePermissions();
            } catch (e) {
                console.error('Błąd pobierania ról:', e);
            }
        }

        function loadRolePermissions() {
            const roleId = document.getElementById('role-select').value;
            const perms = cachedRolePerms[roleId] || {};

            document.getElementById('perm-automod').checked = !!perms.canManageAutoMod;
            document.getElementById('perm-announcements').checked = !!perms.canSendAnnouncements;
        }

        // Zapisywanie permisji dla ról
        async function saveRolePermissions() {
            const roleId = document.getElementById('role-select').value;
            const permissions = {
                canManageAutoMod: document.getElementById('perm-automod').checked,
                canSendAnnouncements: document.getElementById('perm-announcements').checked
            };

            const res = await fetch(`${API_BASE}/roles/permissions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guildId: GUILD_ID, roleId, permissions })
            });

            const data = await res.json();
            alert(data.message);
        }

        // 4. Wysyłanie polecenia zmiany AutoModa do bota
        async function saveAutoMod() {
            const antiLink = document.getElementById('toggle-antilink').checked;
            const antiCaps = document.getElementById('toggle-anticaps').checked;

            const res = await fetch(`${API_BASE}/automod`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guildId: GUILD_ID, antiLink, antiCaps })
            });

            const data = await res.json();
            alert(data.message || 'Zapisano ustawienia AutoModa!');
        }

        // 5. Wysyłanie wiadomości z panelu na kanał Discord
        async function sendAnnouncement() {
            const channelId = document.getElementById('channel-id-input').value.trim();
            const title = document.getElementById('msg-title-input').value.trim();
            const message = document.getElementById('msg-content-input').value.trim();

            if (!channelId || !message) return alert('Podaj ID kanału oraz treść!');

            const res = await fetch(`${API_BASE}/announcement`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ channelId, title, message })
            });

            const data = await res.json();
            if (data.success) {
                alert('Wiadomość została wysłana na Discorda!');
            } else {
                alert('Błąd: ' + data.error);
            }
        }

        // Pobieraj statystyki na żywo co 3 sekundy
        fetchLiveStats();
        setInterval(fetchLiveStats, 3000);
    </script>
</body>
</html>
